<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nanoheal — Chat widget open</title>
  <style>
    /* Open state: WidgetIframe panel — bottom 4rem / right 2rem, 340×80vh, radius 16px */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #c5ccd6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .frame {
      position: relative;
      width: 1024px;
      max-width: 100%;
      aspect-ratio: 1024 / 552;
      box-shadow: 0 16px 48px rgba(0,0,0,0.22);
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
    }
    .frame > img.landing {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
    }
    .fab {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: transparent;
      z-index: 25;
      display: grid;
      place-items: center;
      padding: 0;
      pointer-events: none;
    }
    .fab img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(15, 23, 42, 0.22));
    }
    .panel {
      position: absolute;
      bottom: 4rem;
      right: 2rem;
      width: 340px;
      height: 80%;
      max-height: calc(100% - 5.5rem);
      z-index: 30;
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.2), 0 2px 8px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      animation: rise 0.2s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      flex-shrink: 0;
    }
    .header-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #eef0f3;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .header-logo img { width: 22px; height: 22px; object-fit: contain; }
    .header-meta { flex: 1; min-width: 0; }
    .header-meta strong {
      display: block;
      font-size: 14px;
      color: #1f2a44;
      font-weight: 700;
      line-height: 1.2;
    }
    .header-meta span {
      font-size: 11px;
      color: #16a34a;
      font-weight: 600;
    }
    .btn-close {
      border: none;
      background: transparent;
      font-size: 20px;
      color: #616161;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
    }
    .chat {
      flex: 1;
      overflow: auto;
      padding: 14px;
      background: #F4F8FB;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #e5e7eb;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 16px; height: 16px; object-fit: contain; }
    .bubble {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      padding: 10px 12px;
      font-size: 13px;
      color: #242424;
      line-height: 1.45;
      max-width: 88%;
    }
    .user-row { justify-content: flex-end; margin-bottom: 12px; }
    .user-bubble {
      background: #0D70B7;
      color: #fff;
      border-radius: 12px;
      border-bottom-right-radius: 4px;
      padding: 10px 12px;
      font-size: 13px;
      max-width: 80%;
      line-height: 1.45;
    }
    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .quick button {
      border: 1px solid #c5d6ef;
      background: #fff;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      color: #0D70B7;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
      align-items: center;
    }
    .composer input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    .send {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #0D70B7;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .send svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="frame">
    <img class="landing" src="landing-bg.png" alt="Existing Nanoheal landing page" />

    <button type="button" class="fab" aria-hidden="true">
      <img src="logo-icon.png" alt="" />
    </button>

    <div class="panel" role="dialog" aria-label="Nanoheal chat">
      <header class="header">
        <div class="header-logo" aria-hidden="true">
          <img src="logo-icon.png" alt="" />
        </div>
        <div class="header-meta">
          <strong>Nanoheal</strong>
          <span>Online</span>
        </div>
        <button class="btn-close" type="button" aria-label="Close">×</button>
      </header>
      <main class="chat">
        <div class="row">
          <div class="avatar" aria-hidden="true"><img src="logo-icon.png" alt="" /></div>
          <div class="bubble">
            Hi
            <div class="quick">
              <button type="button">Browser Issues</button>
              <button type="button">Disk Space Issues</button>
              <button type="button">Talk to support</button>
            </div>
          </div>
        </div>
        <div class="user-row">
          <div class="user-bubble">Chrome keeps freezing</div>
        </div>
        <div class="row">
          <div class="avatar" aria-hidden="true"><img src="logo-icon.png" alt="" /></div>
          <div class="bubble">
            I can open <strong>Browser Issues</strong> for you, or connect you to support.
            <div class="quick">
              <button type="button">Open fix</button>
              <button type="button">Talk to support</button>
            </div>
          </div>
        </div>
      </main>
      <footer class="composer">
        <input type="text" placeholder="Type a message…" />
        <button class="send" type="button" aria-label="Send">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 13.5V2.5M8 2.5 3.5 7M8 2.5 12.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </footer>
    </div>
  </div>
</body>
</html>
