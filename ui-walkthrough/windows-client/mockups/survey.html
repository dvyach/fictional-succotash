<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nanoheal Agent Chat — User Survey</title>
  <style>
    /* Match AEX demo nanoheal-agent-chat / user-provided Agent Chat screenshots */
    :root {
      --nh-surface: #fff;
      --nh-border: #e5e7eb;
      --nh-chat-bg: #eceef2;
      --nh-text: #111827;
      --nh-muted: #6b7280;
      --nh-user: #1e293b;
      --nh-accent: #f5a623;
      --nh-radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #c5ccd6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--nh-text);
    }
    .window {
      width: 420px;
      max-width: 100%;
      height: 640px;
      background: var(--nh-surface);
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #d1d5db;
    }
    .chrome {
      background: #f3f4f6;
      padding: 8px 12px 6px;
      border-bottom: 1px solid #e5e7eb;
    }
    .chrome-dots { display: flex; gap: 6px; margin-bottom: 6px; }
    .chrome-dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .chrome-dots i:nth-child(1) { background: #ff5f57; }
    .chrome-dots i:nth-child(2) { background: #febc2e; }
    .chrome-dots i:nth-child(3) { background: #28c840; }
    .chrome-url {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 11px;
      color: #6b7280;
      padding: 4px 10px;
    }
    .header-container {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid var(--nh-border);
      flex-shrink: 0;
    }
    .logo-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo-img { height: 26px; width: auto; max-width: 130px; object-fit: contain; }
    .header-title { font-size: 14px; font-weight: 500; color: #4b5563; }
    .header-actions { display: flex; gap: 4px; }
    .btn-icon {
      width: 32px; height: 32px; border: none; background: transparent;
      color: #9ca3af; font-size: 18px; cursor: pointer; border-radius: 6px; line-height: 1;
    }
    .header-loader { height: 3px; background: #f3f4f6; flex-shrink: 0; }
    .header-loader > i {
      display: block; height: 100%; width: 35%;
      background: linear-gradient(90deg, var(--nh-accent), #ffd54f);
    }
    .chat-area {
      flex: 1;
      overflow: auto;
      padding: 16px;
      background: var(--nh-chat-bg);
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
    }
    .avatar.bot { background: var(--nh-accent); }
    .avatar.user { background: var(--nh-user); color: #fff; }
    .bubble {
      background: #fff;
      border-radius: var(--nh-radius);
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.45;
      max-width: 85%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .bubble.user {
      background: var(--nh-user);
      color: #fff;
    }
    .options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .opt {
      text-align: left;
      border: 1px solid #d1d5db;
      background: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      color: var(--nh-text);
      cursor: pointer;
    }
    .opt.selected { border-color: #374151; border-width: 1.5px; }
    .opt.stars { letter-spacing: 2px; color: #f59e0b; font-size: 16px; }
    .footer {
      background: #fff;
      border-top: 1px solid var(--nh-border);
      padding: 12px;
      flex-shrink: 0;
    }
    .composer {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-reset {
      width: 36px; height: 36px; border: 1px solid #e5e7eb; border-radius: 8px;
      background: #f9fafb; color: #6b7280; cursor: pointer; display: grid; place-items: center;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    .btn-send {
      width: 36px; height: 36px; border: none; border-radius: 8px;
      background: var(--nh-user); color: #fff; cursor: pointer;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .hint { font-size: 11px; color: var(--nh-muted); margin-top: 6px; padding-left: 44px; }
  </style>
</head>
<body>
  <div class="window" role="dialog" aria-label="Nanoheal Agent Chat survey">
    <div class="chrome" aria-hidden="true">
      <div class="chrome-dots"><i></i><i></i><i></i></div>
      <div class="chrome-url">127.0.0.1:3847/?popout=1</div>
    </div>
    <header class="header-container">
      <div class="logo-row">
        <img class="logo-img" src="demo-logo.png" alt="nanoheal" />
        <span class="header-title">Agent Chat</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" type="button" aria-label="Expand">⤢</button>
        <button class="btn-icon" type="button" aria-label="Close">×</button>
      </div>
    </header>
    <div class="header-loader"><i></i></div>
    <main class="chat-area">
      <div class="row">
        <div class="avatar bot" aria-hidden="true"></div>
        <div class="bubble">
          Thanks for running a self-service fix. Quick feedback helps us improve resolutions.
          <div class="options">
            <button class="opt" type="button">★ ★ ★ ★ ★ — Excellent</button>
            <button class="opt selected stars" type="button">★ ★ ★ ★ ☆ — Good</button>
            <button class="opt" type="button">★ ★ ★ ☆ ☆ — Okay</button>
            <button class="opt" type="button">★ ★ ☆ ☆ ☆ — Poor</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="avatar user" aria-hidden="true">U</div>
        <div class="bubble user">Good — 4 stars</div>
      </div>
      <div class="row">
        <div class="avatar bot" aria-hidden="true"></div>
        <div class="bubble">
          What best describes the outcome?
          <div class="options">
            <button class="opt selected" type="button">Issue resolved</button>
            <button class="opt" type="button">Partially resolved</button>
            <button class="opt" type="button">Still broken</button>
            <button class="opt" type="button">Couldn’t run the fix</button>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="composer">
        <button class="btn-reset" type="button" aria-label="Start over" title="Start over">↻</button>
        <input id="input" type="text" placeholder="Describe your issue or share feedback" />
        <button class="btn-send" type="button" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3.5 11.5 20 4l-5.5 16-3-6.5L3.5 11.5z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="hint">Press Enter to send</div>
    </footer>
  </div>
</body>
</html>
